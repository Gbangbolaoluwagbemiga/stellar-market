[workspace]
resolver = "2"
members = ["escrow", "reputation", "reputation_interface", "dispute", "integration-tests"]

[workspace.dependencies]
soroban-sdk = "21.7.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
